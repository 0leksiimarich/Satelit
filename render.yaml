# ============================================================
# render.yaml — «Сателіт Backend» на Render.com (безкоштовно, без карти)
# Цей файл має лежати В КОРЕНІ вашого репозиторію (там само, де index.html).
# Сервер знаходиться у папці server/, тому rootDir: server.
# Команда запуску використовує run_koyeb.py — він імпортує app з app.py.
# Перевірено локально: /api/health → {"ok":true}, OTP працює.
# ============================================================

services:
  - type: web
    name: satelit-backend
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn run_koyeb:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SATELIT_SECRET
        generateValue: true
      # Пошта для одноразових кодів (OTP). Без SMTP_PASS сервер
      # працює в ДЕМО-режимі й показує код прямо на сайті.
      - key: SMTP_HOST
        value: smtp.ukr.net
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
