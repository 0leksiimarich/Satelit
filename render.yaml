services:
  - type: web
    name: satelit-backend
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SATELIT_SECRET
        generateValue: true
      - key: SATELIT_DATA_FILE
        value: /tmp/satelit_data.json
      - key: SMTP_HOST
        value: smtp.ukr.net
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
