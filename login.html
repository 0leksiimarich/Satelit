<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід — Сателіт</title>
  <meta name="description" content="Вхід в акаунт магазину «Сателіт»: email і пароль.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="header-mount"></div>

  <main class="container">
    <div class="form-card">
      <img src="assets/logo.svg" alt="Логотип Сателіт" style="height:56px;margin:0 auto 12px;">
      <h1>Увійти в акаунт</h1>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••">
        </div>
        <div class="field">
          <label for="login-code">Код із пошти <span style="font-weight:400;color:var(--gray-600);">(потрібен лише якщо ви запитували одноразовий код)</span></label>
          <input type="text" id="login-code" inputmode="numeric" autocomplete="one-time-code"
                 maxlength="6" pattern="[0-9]*" placeholder="не обов'язково">
        </div>
        <p class="error-text" id="login-error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block">Увійти</button>
      </form>

      <p class="divider">Ще немає акаунта?</p>
      <a class="btn btn-outline btn-block" href="register.html">Створити акаунт</a>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script type="module">
    import { loginUser, getCurrentUser, translateAuthError } from "./auth.js";

    const errEl = document.getElementById("login-error");

    const existing = await getCurrentUser();
    if (existing) { location.href = "account.html"; }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const code = document.getElementById("login-code").value.trim();
      if (!email || !password) { errEl.textContent = "Заповніть email і пароль."; return; }
      try {
        await loginUser(email, password, code);
        location.href = "account.html";
      } catch (err) {
        errEl.textContent = translateAuthError(err);
      }
    });
  </script>
</body>
</html>ml>
