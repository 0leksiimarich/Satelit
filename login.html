<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід — Сателіт</title>
  <meta name="description" content="Вхід в акаунт магазину «Сателіт»: email і пароль або Google.">
  <link rel="icon" href="assets/logo.svg" type="image/png">
  <meta property="og:title" content="Вхід — Сателіт">
  <meta property="og:description" content="Вхід в акаунт магазину техніки «Сателіт» (Шпола).">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/logo.svg">
  <meta property="og:locale" content="uk_UA">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="header-mount"></div>

  <main class="container">
    <div class="form-card">
      <!-- Логотип на сторінці входу -->
      <img src="assets/logo.svg" alt="Логотип Сателіт" style="height:56px;margin:0 auto 12px;">
      <h1>Увійти в акаунт</h1>

      <div class="demo-note" id="backend-note" hidden>
        Supabase ще не підключено (вставте URL та anon-ключ у supabase.js).
        Форма активна, але реальний вхід запрацює після підключення.
      </div>
      <div class="demo-note" id="google-return-note" hidden style="color:var(--success);">
        Ви ввійшли через Google ✓ Переспрямовуємо…
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••">
        </div>
        <p class="error-text" id="login-error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block">Увійти</button>
      </form>

      <p class="divider">або</p>

      <button class="btn btn-google btn-block" id="google-btn" type="button">
        <svg class="google-btn-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.5 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.5 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.1l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C41.4 35.4 44 30.3 44 24c0-1.3-.1-2.3-.4-3.5z"/>
        </svg>
        Увійти через Google
      </button>

      <p class="divider">Ще немає акаунта?</p>
      <a class="btn btn-outline btn-block" href="register.html">Створити акаунт</a>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script type="module">
    import { isSupabaseConfigured } from "./supabase.js";
    import { signInWithEmail, signInWithGoogle, translateAuthError, getCurrentUser } from "./auth.js";

    if (!isSupabaseConfigured) {
      document.getElementById("backend-note").hidden = false;
    }

    const errEl = document.getElementById("login-error");

    // Повернення після Google-входу: перевіряємо сесію.
    const existingUser = await getCurrentUser();
    if (existingUser) {
      document.getElementById("google-return-note").hidden = false;
      location.href = "account.html";
    }

    function showErr(err) {
      if (err && err.message === "DEMO_MODE") {
        errEl.textContent = "Авторизація ще не підключена (додайте Supabase ключі в supabase.js).";
      } else {
        errEl.textContent = translateAuthError(err);
      }
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) {
        errEl.textContent = "Заповніть email і пароль.";
        return;
      }
      try {
        await signInWithEmail(email, password);
        location.href = "account.html";
      } catch (err) {
        showErr(err);
      }
    });

    document.getElementById("google-btn").addEventListener("click", async () => {
      errEl.textContent = "";
      try {
        await signInWithGoogle(); // сторінка перейде на Google
      } catch (err) {
        showErr(err);
      }
    });
  </script>
</body>
</html>
